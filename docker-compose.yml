services:
  mongo:
    container_name: local_mongo
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    volumes:
      - local_mongo:/data/db
    ports:
      - 27017:27017
    networks:
      - local_mongo_net
    #restart: always

  # mongo-express:
  #   image: mongo-express
  #   #restart: always
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_BASICAUTH_USERNAME: 'admin'
  #     ME_CONFIG_BASICAUTH_PASSWORD: 'password'
  #    # ME_CONFIG_MONGODB_ADMINUSERNAME: dev
  #    # ME_CONFIG_MONGODB_ADMINPASSWORD: dev
  #     ME_CONFIG_MONGODB_URL: mongodb://dev:dev@local_mongo:27017/
  #   networks:
  #     - local_mongo_net

networks:
  local_mongo_net:
    driver: bridge

volumes:
  local_mongo:
